# Camera History — legacy domain redirect
# The app now lives at https://camera-history.com. Keep this host for 12 months
# so old links, embeds and search results reach the new domain.
server {
    listen 80;
    server_name camera.sengycraft.cz;
    return 301 https://camera-history.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name camera.sengycraft.cz;

    ssl_certificate     /etc/cloudflare/cert/cert.pem;
    ssl_certificate_key /etc/cloudflare/cert/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/camera.sengycraft.cz.log;
    error_log  /var/log/nginx/camera.sengycraft.cz.log error;

    # Removed demo pages stay gone.
    location ^~ /demo/ {
        return 410;
    }

    location / {
        return 301 https://camera-history.com$request_uri;
    }
}
