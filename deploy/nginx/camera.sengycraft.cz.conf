# Camera History SaaS — camera.sengycraft.cz
# TLS terminates at Cloudflare edge; origin listens on 443 with Cloudflare origin cert.
server {
    listen 80;
    server_name camera.sengycraft.cz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name camera.sengycraft.cz;

    root /home/ubuntu/camera-history/packages/site/dist;
    index index.html;

    access_log /var/log/nginx/camera.sengycraft.cz.log;
    error_log  /var/log/nginx/camera.sengycraft.cz.log error;

    ssl_certificate     /etc/cloudflare/cert/cert.pem;
    ssl_certificate_key /etc/cloudflare/cert/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    # Widget je urcen k embedovani na cizich webech -> dovolit framing.
    add_header Content-Security-Policy "frame-ancestors *" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Frontend + backend: vse pod /api/v1/...
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin dashboard SPA (/admin/)
    location /admin/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /home/ubuntu/camera-history/packages/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Embeddable widget SPA (/widget/:tenant/:cameraId and /group/:tenant/:slug)
    location /widget/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        alias /home/ubuntu/camera-history/packages/web/dist/;
        try_files $uri /widget/index.html;
    }
    location /widget/assets/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        alias /home/ubuntu/camera-history/packages/web/dist/assets/;
        try_files $uri =404;
    }
    location /group/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        alias /home/ubuntu/camera-history/packages/web/dist/;
        try_files $uri /widget/index.html;
    }

    # Generated WordPress plugin ZIP. Never cache; always download it.
    location = /downloads/camera-history.zip {
        alias /home/ubuntu/camera-history/packages/wp-plugin/dist/camera-history.zip;
        add_header Content-Disposition 'attachment; filename="camera-history.zip"' always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        types { application/zip zip; }
    }

    # PDF must not be edge-cached: it is regenerated on deck edits.
    location = /deck.pdf {
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, max-age=0" always;
        expires -1;
    }

    # Embed helper changes over time; do not let the edge cache it for hours.
    location = /embed.js {
        add_header Cache-Control "no-store, max-age=0" always;
        expires -1;
    }

    # Brand preview page was removed; keep brand assets available and uncached.
    location = /brand { return 410; }
    location = /brand/ { return 410; }
    location = /brand/index.html { return 410; }
    location ^~ /brand/ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Mutable social image, icons and crawler files: never cache.
    location ~ ^/(favicon|apple-touch-icon|og-image|robots\.txt|sitemap\.xml) {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Avoid duplicate landing URLs without redirecting the internal "/" index.
    if ($request_uri = /index.html) {
        return 301 /;
    }

    # Removed demo pages: permanent removal for search engines.
    location ^~ /demo/ {
        return 410;
    }
    location /deck/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # Static landing (real files only)
    location / {
        try_files $uri $uri/ =404;
    }
}
