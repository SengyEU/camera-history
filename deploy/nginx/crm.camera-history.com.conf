# Camera History — internal CRM
# Separate SPA on crm.camera-history.com. Only auth and internal API routes are
# proxied, so the CRM stays same-origin without exposing the rest of the API.
server {
    listen 80;
    server_name crm.camera-history.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.camera-history.com;

    root /home/ubuntu/camera-history/packages/crm/dist;
    index index.html;

    access_log /var/log/nginx/crm.camera-history.com.log;
    error_log  /var/log/nginx/crm.camera-history.com.log error;

    ssl_certificate     /etc/cloudflare/cert/camera-history.com.pem;
    ssl_certificate_key /etc/cloudflare/cert/camera-history.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 3m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Same-origin auth and CRM API only.
    location /api/v1/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/internal/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api/ must not fall through to the SPA.
    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
