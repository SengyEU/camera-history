server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /widget/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}